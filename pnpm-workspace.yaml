packages:
  - 'apps/*'
  - 'packages/*'

# Fail the install when Node or pnpm do not match "engines" in package.json,
# so nobody works with a different version without noticing (D114).
engineStrict: true

# Only install versions published at least 14 days ago (20160 minutes),
# transitive ones included (D131): a broken or hijacked release is usually
# caught and pulled within days. pnpm applies it whenever it picks a version
# (pnpm add, pnpm update, Dependabot), but it does not re-check the versions
# pnpm-lock.yaml already has: CI checks the ones each PR adds
# (scripts/check-release-age.mjs).
# https://pnpm.io/10.x/settings#minimumreleaseage
minimumReleaseAge: 20160
# Security fixes do not wait. Exempt the exact patched version, never the whole
# package, so later releases of it still wait (the CI check refuses anything
# else). Note the advisory and the date the version turns 14 days old; from
# that date the check asks to delete the entry:
#   - next@16.4.6 # GHSA-xxxx-xxxx-xxxx · 14 days on 2026-12-01
# https://pnpm.io/10.x/settings#minimumreleaseageexclude
minimumReleaseAgeExclude: []

# sharp (Next's optional native image optimizer) cannot run in a Worker, and
# OpenNext's bundler follows pnpm's links straight to it (S-4, D129). Images
# are never optimized by Next here: galleries bring their own previews.
ignoredOptionalDependencies:
  - sharp
# Keep sharp out of pnpm's shared hoisting folder, so Next cannot reach the
# copy that wrangler brings for its local runtime.
hoistPattern:
  - '*'
  - '!sharp'
  - '!@img/*'

overrides:
  # wrangler's local runtime (miniflare) pins sharp 0.35.4, whose bundled
  # librsvg has GHSA-wq5f-xc86-pv6w. It only runs on developer machines, never
  # in the Worker. Remove once wrangler ships 0.35.5 or newer.
  'miniflare>sharp': 0.35.5
  # glob has GHSA-3g3m-2fjr-6pw4 and minimatch GHSA-g3hv-75wg-m249, and only
  # their new majors have the fix. OpenNext, ESLint, the Nest CLI and Sentry's
  # bundler plugins still ask for the old ones. All of them are build tools:
  # their patterns come from this repo and none passes an AbortSignal. Remove
  # each once those packages accept glob 14.0.2 and minimatch 11.0.1 or newer.
  'glob@>=9.0.0 <14.0.2': 14.0.3
  'minimatch@>=7.0.0 <11.0.1': 11.0.4
  # minimatch 11 asks for ^1.0.3 of this package, created on 2026-10-26; 1.1.0
  # came out on 2026-11-05. Keep 1.0.3 until a newer one is 14 days old (D131).
  '@isaacs/nonrecursive-glob-match': 1.0.3
  # drizzle-kit 0.31 still declares @esbuild-kit (abandoned, merged into tsx),
  # which pins esbuild 0.18 with the dev-server advisory GHSA-67mh-4wv8-2f99
  # (Dependabot #18). drizzle-kit never loads it, so it gets the esbuild that
  # drizzle-kit itself uses. Remove once drizzle-kit drops @esbuild-kit.
  '@esbuild-kit/core-utils>esbuild': 0.25.12
  # @nestjs/platform-express pins multer 2.4.0 (still in 12.2.0, the latest),
  # which has the denial of service GHSA-q7qp-rjg7-q26m. The API parses no
  # multipart bodies yet, but multer ships in its image. Remove once Nest pins
  # 2.5.0 or newer.
  '@nestjs/platform-express>multer': 2.5.0
  # wrangler's local runtime (miniflare) pins undici 7.29.1, which has three
  # advisories (GHSA-xjj6-f33q-929c, GHSA-4qv8-2p9j-2685, GHSA-f72v-6w45-q472).
  # It only runs on developer machines, never in the Worker. Remove once
  # wrangler ships undici 7.30.1 or newer.
  'miniflare>undici': 7.30.1
