# Continuous integration (Phase 2 §6). `quality` and `test` are required
# checks in the `main` ruleset: a PR cannot be merged while either fails.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR cancels the run in progress; runs on main never cancel.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Only what changed (`turbo run --affected`): a PR compares against the main
  # commit it targets, a push to main against the previous commit. Root files
  # that affect every package are listed in `globalDependencies` (turbo.json).
  TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'
  HUSKY: '0'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      local-seed: ${{ steps.database-changes.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so Turborepo can diff against TURBO_SCM_BASE.
          fetch-depth: 0

      - name: Detect changes that need real Supabase
        id: database-changes
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DIFF_HEAD: ${{ github.sha }}
        run: |
          git diff --name-only "$DIFF_BASE" "$DIFF_HEAD" > "$RUNNER_TEMP/database-paths"
          if grep -Eq '^(apps/api/|packages/shared/|infra/supabase/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|turbo\.json$|\.nvmrc$|tsconfig\.base\.json$|\.github/(workflows/ci\.yml$|actions/))' "$RUNNER_TEMP/database-paths"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/setup

      - name: Check formatting
        run: pnpm format:check

      - name: Lint and typecheck
        run: pnpm exec turbo run lint typecheck --affected

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # Plain Postgres with the same major version as the Supabase projects (17).
      # Integration tests apply the migrations to it from scratch (issue #11).
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: focaldrop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/focaldrop_test
      MIGRATIONS_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/focaldrop_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Test and build
        run: pnpm exec turbo run test build --affected

  local-seed:
    # A real local Supabase instance catches Auth/role differences that a plain
    # Postgres fixture cannot. No staging credentials or project are used.
    needs: quality
    if: needs.quality.outputs.local-seed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: development
      MIGRATIONS_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Start disposable local Supabase
        run: |
          if ! pnpm db:start > "$RUNNER_TEMP/supabase-start.log" 2>&1; then
            sed -E 's/(eyJ[A-Za-z0-9_.-]+|sb_secret_[A-Za-z0-9_-]+)/[redacted]/g' "$RUNNER_TEMP/supabase-start.log" | tail -n 40
            exit 1
          fi
      - name: Capture local CLI credentials without printing them
        run: pnpm exec supabase status --workdir infra --output env > infra/supabase/.env.local
      - name: Migrate a fresh clone using the README command
        run: |
          test ! -d packages/shared/dist
          pnpm db:migrate
      - name: Seed with an obsolete shared build using the README command
        run: |
          printf 'export const obsolete = true;\n' > packages/shared/dist/index.js
          pnpm db:seed
          pnpm --filter @focaldrop/api db:verify-local
      - name: Test integrations with the real non-superuser Supabase role
        run: pnpm --filter @focaldrop/api test:integration
      - name: Verify reset applies migrations and seeds again
        run: |
          if ! pnpm db:reset > "$RUNNER_TEMP/supabase-reset.log" 2>&1; then
            sed -E 's/(eyJ[A-Za-z0-9_.-]+|sb_secret_[A-Za-z0-9_-]+)/[redacted]/g' "$RUNNER_TEMP/supabase-reset.log" | tail -n 40
            exit 1
          fi
          pnpm --filter @focaldrop/api db:verify-local
      - name: Stop local Supabase
        if: always()
        run: pnpm db:stop
